       kana:p[1],
       meaning:p.slice(2).join(" "),
       pos:""
     });
   }else if(p.length===2){
     // 假名/无汉字单词：
     // のんびり    悠闲、悠然
     // でたらめ    胡乱、胡说八道
     arr.push({
       kanji:p[0],
       kana:p[0],
       meaning:p[1],
       pos:""
     });
   }
 }

 if(!arr.length){
   document.getElementById("importMsg").textContent=
     "没有识别成功。请使用：汉字＋假名＋中文，或假名＋中文，每行一个单词。";
   return;
 }

 const id="lib_"+Date.now();
 const name="我的词库 "+(libs.length);
 libs.push({id,name,words:arr});
 selected=id;
 save();

 document.getElementById("importBox").value="";
 document.getElementById("importMsg").textContent=
   "✓ 已新建「"+name+"」： "+arr.length+" 个单词。";
 renderLibraries();
}
function start(){const lib=libs.find(x=>x.id===selected);if(!lib?.words.length)return;const n=Math.min(+document.getElementById("amount").value||10,lib.words.length);pool=[...lib.words].sort(()=>Math.random()-.5).slice(0,n).map((w,i)=>({...w,id:i}));left=total=pool.length;lastId=null;document.getElementById("home").classList.add("hidden");document.getElementById("quiz").classList.remove("hidden");document.getElementById("quizLibrary").textContent=lib.name;draw()}
function value(w){return mode==="meaning"?w.meaning:mode==="kanji"?w.kanji:w.kana}
function draw(){if(left===0){document.getElementById("quiz").innerHTML=`<div class="finish"><div class="big">✓</div><h2>这一轮完成</h2><p>这组 ${total} 个单词全部答对。</p><button class="homebtn" onclick="goHome()">回到首页</button></div>`;return}locked=false;let c=pool.filter(x=>x.id!==lastId);current=c.length?c[Math.floor(Math.random()*c.length)]:pool[0];lastId=current.id;document.getElementById("leftText").textContent="剩余 "+left;document.getElementById("roundText").textContent=(total-left)+"/"+total;document.getElementById("progress").style.width=((total-left)/total*100)+"%";document.getElementById("question").textContent=mode==="reading"?current.kanji:current.kana;document.getElementById("currentAnswer").classList.add("hidden");document.getElementById("currentAnswer").innerHTML="";document.getElementById("inspectAnswer").classList.add("hidden");document.getElementById("inspectAnswer").innerHTML="";document.getElementById("nextBtn").classList.add("hidden");makeOptions()}
function makeOptions(){const correct=value(current),lib=libs.find(x=>x.id===selected),vals=[...new Set(lib.words.map(value).filter(x=>x&&x!==correct))].sort(()=>Math.random()-.5).slice(0,3);vals.push(correct);vals.sort(()=>Math.random()-.5);const box=document.getElementById("options");box.innerHTML="";vals.forEach(v=>{const b=document.createElement("button");b.className="option";b.textContent=v;b.onclick=()=>choose(b,v,correct);box.appendChild(b)})}
function showCurrentAnswer(w,label){
 const r=document.getElementById("currentAnswer");
 r.classList.remove("hidden");
 r.innerHTML=`<div class="inspect-title">${esc(label)}</div><div class="main">${esc(w.kanji)}（${esc(w.kana)}）</div><div class="meaning">${esc(w.meaning)}</div>`;
}
function showOptionMeaning(text){
 const lib=libs.find(x=>x.id===selected);
 if(!lib)return;
 const w=lib.words.find(x=>value(x)===text);
 if(!w)return;
 const r=document.getElementById("inspectAnswer");
 r.classList.remove("hidden");
 r.innerHTML=`<div class="inspect-title">查看这个选项</div><div class="main">${esc(w.kanji)}（${esc(w.kana)}）</div><div class="meaning">${esc(w.meaning)}</div>`;
}
function choose(btn,v,correct){
 if(locked)return;
 locked=true;
 const ok=v===correct;
 document.querySelectorAll(".option").forEach(b=>{
   if(b.textContent===correct)b.classList.add("correct");
   else if(b===btn)b.classList.add("wrong");
 });
 showCurrentAnswer(current,ok?"✓ 当前题答案":"✕ 当前题答案");
 if(ok){
   pool=pool.filter(x=>x.id!==current.id);
   left--;
   document.getElementById("nextBtn").classList.add("hidden");
   setTimeout(draw,450);
 }else{
   document.querySelectorAll(".option").forEach(b=>{
     if(b.textContent!==correct){
       b.disabled=false;
       b.classList.add("inspect");
       b.onclick=()=>showOptionMeaning(b.textContent);
     }
   });
   document.getElementById("inspectAnswer").classList.add("hidden");
   document.getElementById("inspectAnswer").innerHTML="";
   document.getElementById("nextBtn").classList.remove("hidden");
 }
 document.getElementById("leftText").textContent="剩余 "+left;
}
function nextQuestion(){
 document.getElementById("nextBtn").classList.add("hidden");
 draw();
}
function goHome(){location.reload()}
renderLibraries();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script></body></html>
